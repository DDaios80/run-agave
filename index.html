<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Run, Agave!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one screen. A slim bar with the name and the score, the cove as the hero, the four chasers named underneath;
   everything shares the width the cove gets, so the column is as wide as the window's height allows. */
:root {
  --bg: #e4efed; --panel: #f5faf9; --fg: #12303a; --muted: #4d6971; --rule: #bfd4d2;
  --accent: #b03a72; --on-accent: #ffffff;                       /* Agave's rose */
  --water: #12303a; --foam: #ffffff; --depth: rgba(0, 0, 0, 0.6); /* the cove keeps its colours in both themes */
  --display: "Pixelify Sans", ui-monospace, "SF Mono", Menlo, monospace;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #091a20; --panel: #0f262e; --fg: #e4f0f1; --muted: #9bb6bb; --rule: #23424b; --accent: #f29bc1; --on-accent: #2b0f1d; color-scheme: dark }
}
:root[data-theme="dark"] { --bg: #091a20; --panel: #0f262e; --fg: #e4f0f1; --muted: #9bb6bb; --rule: #23424b; --accent: #f29bc1; --on-accent: #2b0f1d; color-scheme: dark }

* { box-sizing: border-box }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap {
  width: min(100%, 46rem, max(17rem, calc((100dvh - 12rem) * 0.905)));
  margin: 0 auto; padding-block: 1rem 1.5rem;
  display: flex; flex-direction: column; gap: 0.75rem;
}
.pix { image-rendering: pixelated; display: block; flex: none }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem }
.name { display: flex; align-items: center; gap: 0.5rem; margin: 0 auto 0 0; font: 700 1.6rem/1 var(--display); letter-spacing: 0.01em }
.name canvas { width: 32px; height: 38px }
.logo { flex: none; height: 2.4rem; width: auto; padding: 0.3rem 0.55rem; border-radius: 8px; background: var(--foam) }      /* on white in both themes: a logo is drawn for a white page */
.hud { display: flex; align-items: center; gap: 1rem; margin: 0 }
.hud div { display: flex; flex-direction: column; gap: 0.1rem }
.hud dt { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted) }
.hud dd { margin: 0; font: 700 1.15rem/1 var(--display); font-variant-numeric: tabular-nums; min-height: 1.15rem }
.lives { display: flex; gap: 2px }
.lives canvas { width: 16px; height: 19px }
.lives canvas.gone { opacity: 0.18 }

button { font: 600 0.9rem var(--body); cursor: pointer; border-radius: 8px }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.pause { min-height: 2.25rem; padding: 0 0.8rem; background: transparent; color: var(--fg); border: 1px solid var(--rule) }
.pause:hover { border-color: var(--accent) }

.board { position: relative; border-radius: 10px; overflow: hidden; background: var(--water); box-shadow: 0 0 0 1px var(--rule) }
.board canvas { width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none }
.board canvas.over { position: absolute; inset: 0; height: 100%; pointer-events: none }
.tok { display: block; flex: none }
.name canvas.tok { width: 38px; height: 38px }
.lives canvas.tok { width: 20px; height: 20px }
.cast canvas.tok { width: 36px; height: auto }
.word { position: absolute; left: 0; right: 0; top: 52%; margin: 0; text-align: center; pointer-events: none; color: var(--foam); font: 700 clamp(1rem, 4.4vw, 1.5rem)/1.1 var(--display); text-shadow: 0 2px 0 var(--depth) }
.veil { position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; text-align: center; color: var(--foam); background: color-mix(in srgb, var(--water) 80%, transparent) }
.veil h2 { margin: 0; font: 700 clamp(1.7rem, 8vw, 2.6rem)/1 var(--display); text-wrap: balance }
.veil p { margin: 0.6rem auto 0; max-width: 24rem; font-size: 0.95rem; text-wrap: balance }
.veil .best { font-weight: 700 }
.veil button { margin-top: 1rem; min-height: 2.9rem; padding: 0 1.6rem; border: 0; background: var(--foam); color: var(--water); font-size: 1rem; font-weight: 700 }
.veil button:hover { filter: brightness(0.93) }
.veil button:focus-visible { outline-color: var(--foam) }
.opts { display: flex; flex-direction: column; gap: 0.5rem; width: fit-content; max-width: 22rem; margin: 1rem auto 0 }
.duo { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; text-align: left; cursor: pointer }
.nb { white-space: nowrap }
.looks { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel) }
.looks summary { cursor: pointer; padding: 0.6rem 0.75rem; font-size: 0.9rem; font-weight: 600 }
.looks summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px }
#looks-list { display: flex; flex-direction: column; gap: 0.8rem; padding: 0.25rem 0.75rem 0.8rem }
.look { display: flex; align-items: flex-start; gap: 0.75rem }
.look > div { min-width: 0; display: flex; flex-direction: column; gap: 0.35rem }
.look strong { font-size: 0.9rem }
.look canvas.tok { width: 44px; height: auto }
.look canvas.pix { width: 40px; height: 47.5px }
.picks { display: flex; flex-wrap: wrap; gap: 0.3rem }
.picks button { min-height: 1.9rem; padding: 0 0.65rem; border: 1px solid var(--rule); border-radius: 999px; background: transparent; color: var(--fg); font-size: 0.78rem }
.picks button[aria-checked="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent) }
.picks .swatch { width: 1.9rem; padding: 0; border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--rule) }
.picks .swatch[aria-checked="true"] { border-color: var(--panel); box-shadow: 0 0 0 2px var(--fg) }
.who { margin-top: 0.8rem }
.who p { margin: 0 0 0.35rem; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase }
.who-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25rem }
.veil .who-list button { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; width: 3.5rem; min-height: 0; margin: 0; padding: 0.3rem 0.1rem; border: 2px solid transparent; border-radius: 10px; background: transparent; color: var(--foam); font-size: 0.72rem; font-weight: 600 }
.veil .who-list button[aria-checked="true"] { border-color: var(--foam); background: color-mix(in srgb, var(--foam) 18%, transparent) }
.who-list canvas { display: block; width: 38px; height: 38px; border-radius: 50% }
.duo input { flex: none; width: 1.1rem; height: 1.1rem; margin: 0; accent-color: var(--accent) }
.duo input:focus-visible { outline: 3px solid var(--foam); outline-offset: 2px }
.bar .duo { min-height: 2.25rem; font-size: 0.9rem; font-weight: 600 }
.bar .duo input:focus-visible { outline-color: var(--accent) }

.after { margin: 0.25rem 0 0; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted) }
.cast { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem }
.cast li { display: flex; align-items: center; gap: 0.6rem; min-width: 0; padding: 0.45rem 0.6rem; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px }
.cast canvas { width: 32px; height: 38px }
.cast span { min-width: 0; font-size: 0.8rem; color: var(--muted) }
.cast strong { display: block; font-size: 0.9rem; color: var(--fg) }
.cast li.steered { border-color: var(--accent) }
.cast li.steered span { color: var(--accent) }
.cast li.steered strong { color: var(--fg) }
.keys { margin: 0; font-size: 0.82rem; color: var(--muted) }
kbd { font: 600 0.78rem var(--body); padding: 0.05rem 0.35rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); color: var(--fg) }
</style>
</head>
<body>
<main class="wrap">
  <header class="bar">
    <img id="logo" class="logo" alt="" hidden>
    <h1 class="name"><canvas id="face" class="pix" aria-hidden="true"></canvas><span id="title"></span></h1>
    <dl class="hud">
      <div><dt>Score</dt><dd id="score">0</dd></div>
      <div><dt>Level</dt><dd id="level">1</dd></div>
      <div><dt>Lives</dt><dd id="lives" class="lives" role="img" aria-label="3 lives"></dd></div>
    </dl>
    <button id="pause" class="pause" type="button" hidden>Pause</button>
    <label class="duo"><input type="checkbox" id="music" checked><span>Music</span></label>
  </header>

  <section class="board" aria-label="The cove">
    <canvas id="cove" class="pix" width="342" height="378" role="img" aria-label="The cove"></canvas>
    <canvas id="faces" class="over" aria-hidden="true" hidden></canvas>
    <p id="word" class="word" aria-live="polite" hidden></p>
    <div id="veil" class="veil">
      <div>
        <h2 id="veil-title"></h2>
        <p id="veil-text"></p>
        <p id="veil-best" class="best" hidden></p>
        <div id="who" class="who" hidden><p id="who-title">Who is being chased?</p><div id="who-list" class="who-list" role="radiogroup" aria-labelledby="who-title"></div></div>
        <button id="play" type="button">Play</button>
        <div class="opts">
          <label class="duo"><input type="checkbox" id="duo"><span>Two players: the second steers <span data-who="lead"></span> with <span class="nb"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></span></span></label>
          <label class="duo" id="look" hidden><input type="checkbox" id="kymas"><span>Kymas instead of the faces</span></label>
        </div>
      </div>
    </div>
  </section>

  <p class="after" id="after">After you</p>
  <ul class="cast" id="cast" aria-labelledby="after"></ul>
  <details class="looks"><summary>Choose how everybody looks</summary><div id="looks-list"></div></details>
  <p class="keys">The arrow keys, <span class="nb"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></span> or a swipe steer <span data-who="runner"></span>. <kbd>Space</kbd> pauses.</p>
</main>

  // ── The game itself: the rules of Wave-man (Cove Learn, src/lib/chase.ts), with Agave as the runner. ──────────
  const COLS = 19, ROWS = 21;
  // "#" sand bank, "." pearl, "o" starfish, "D" the den the chasers wait in, "-" its door. Row 9 is the tunnel.
  const MAZE = [
    "###################",
    "#o.......#.......o#",
    "#.##.###.#.###.##.#",
    "#.................#",
    "#.##.#.#####.#.##.#",
    "#....#...#...#....#",
    "####.###.#.###.####",
    "#....#.......#....#",
    "#.##.#.##-##.#.##.#",
    " ....  #DDD#  .... ",
    "#.##.#.#####.#.##.#",
    "#....#.......#....#",
    "####.#.#####.#.####",
    "#........#........#",
    "#.##.###.#.###.##.#",
    "#o.#.....P.....#.o#",
    "##.#.#.#####.#.#.##",

  const chaserSpeed = (level) => Math.min(8.2, 4.9 + 0.3 * (level - 1));

  function fill(g) {
    g.left = 0;
    MAZE.forEach((row, y) => [...row].forEach((ch, x) => { const v = ch === "." ? 1 : ch === "o" ? 2 : 0; g.cells[y * COLS + x] = v; if (v) g.left += 1; }));

  function newGame() {

  const BASS = [45, 41, 48, 43];
  // Two short pieces of our own for the turns of a game (Dimitris, 24 Nov 2026), as [piano key, seconds] one after another.
  const FAIL = [[67, 0.18], [66, 0.18], [65, 0.18], [64, 0.55]];                                 // caught: four steps down
  const CHEER = [[72, 0.1], [76, 0.1], [79, 0.1], [84, 0.1], [79, 0.1], [84, 0.6]];             // every pearl gone: up the chord and home
  let music = true, audio = null, out = null, fx = null, hiss = null, sounding = false, beat = 0, due = 0, heard = "";
  try { music = localStorage.getItem(MUSIC) !== "0"; } catch { /* a private window: music on, as at first */ }
  /** Called from a click or a key: a browser lets a page make sound only once its visitor has touched it. */
  function wake() {
    if (!music) return;
    // On an iPhone the silent switch also silences a page's own sound, unless the page says that it is playing music
    // (Dimitris, 24 Nov 2026: no music on the open-web address, which a desktop browser played).
    try { if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback"; } catch { /* not this browser */ }
    try {

        out = audio.createGain(); out.gain.value = 0; out.connect(audio.destination);          // the tune, which falls silent now and then
        fx = audio.createGain(); fx.gain.value = 0.5; fx.connect(audio.destination);            // the short pieces, which play through that silence
        hiss = audio.createBuffer(1, Math.round(audio.sampleRate * 0.05), audio.sampleRate);     // a breath of noise, for the off-beats
        const d = hiss.getChannelData(0);
        for (let i = 0; i < d.length; i += 1) d[i] = Math.random() * 2 - 1;
      }
      if (audio.state !== "running") audio.resume();                 // "suspended" at first; on a phone also "interrupted", after a call or a locked screen
    } catch { audio = null; }                                        // no sound on this device: the game plays on in silence
  }
  function note(source, at, length, loud, to = out) {
    const g = audio.createGain();
    g.gain.setValueAtTime(loud, at); g.gain.exponentialRampToValueAtTime(0.001, at + length);
    source.connect(g); g.connect(to); source.start(at); source.stop(at + length + 0.02);
  }
  function jingle(notes, type, loud) {
    let at = audio.currentTime + 0.03;
    for (const [key, length] of notes) {
      note(voice(type, key), at, length * 0.95, loud, fx); note(voice("triangle", key - 12), at, length * 0.95, 0.2, fx);
      at += length;
    }
  }
  function voice(type, key) {
    const o = audio.createOscillator();
    o.type = type; o.frequency.value = 440 * 2 ** ((key - 69) / 12);
    return o;
  }
  /**
   * Ten times a second, on a timer of its own: while a game runs, write down the notes of the next 0.6 seconds;
   * otherwise fall silent. Not once a frame: a browser that slows a page's frames would leave holes in the tune.
   */
  function tune() {
    if (!audio) return;
    const phase = game ? game.phase : "", now = audio.currentTime;
    if (phase !== heard) {                                           // a turn of the game: its short piece, and the tune starts afresh after it
      if (music && stage !== "intro" && phase === "caught") { jingle(FAIL, "sawtooth", 0.1); beat = 0; }
      if (music && stage !== "intro" && phase === "clear") { jingle(CHEER, "square", 0.12); beat = 0; }
      heard = phase;
    }
    const on = music && stage === "play" && !paused && !document.hidden && (phase === "play" || phase === "ready");
    if (on !== sounding) { sounding = on; out.gain.setTargetAtTime(on ? 0.5 : 0, now, 0.03); }
    if (!on) return;
    if (due < now) due = now + 0.05;                                 // after a silence the tune carries on from where it stopped
    while (due < now + 0.6) {
      const i = beat % LEAD.length;
      if (LEAD[i]) note(voice("square", LEAD[i]), due, STEP * 1.7, 0.07);
      if (i % 2 === 0) note(voice("triangle", BASS[Math.floor(i / 16) % 4] + (i % 4 ? 12 : 0)), due, STEP * 1.8, 0.22);
      if (i % 4 === 2) { const h = audio.createBufferSource(); h.buffer = hiss; note(h, due, 0.04, 0.05); }
      due += STEP; beat += 1;
    }
  }
  $("music").checked = music;
  setInterval(tune, 100);

  function hud() {
    const g = game, steered = stage === "play" ? g.humans[0] : $("duo").checked;      // a second player steers Dimitris
    const key = `${stage},${steered},` + (g ? `${paused},${g.score},${g.level},${g.lives},${g.phase}` : "");
    if (key === shown) return;
    shown = key;
    const lives = g ? g.lives : 3;
    $("score").textContent = points(g ? g.score : 0);
    $("level").textContent = g ? g.level : 1;
    $("lives").setAttribute("aria-label", `${lives} ${lives === 1 ? "life" : "lives"}`);
    [...$("lives").children].forEach((c, i) => c.classList.toggle("gone", i >= lives));
    $("pause").hidden = stage !== "play";
    $("pause").textContent = paused ? "Resume" : "Pause";
    const word = stage !== "play" ? "" : paused ? "Paused" : g.phase === "ready" ? "Ready?" : g.phase === "clear" ? `Level ${g.level} cleared!` : g.phase === "caught" ? `${cast[g.by].name} caught you!` : "";
    $("word").textContent = word; $("word").hidden = !word;
    const lead = $("cast").firstElementChild;
    lead.classList.toggle("steered", steered);
    lead.querySelector("span").lastChild.textContent = steered ? "steered by the second player" : SLOTS[0].does;
  }
  function start() {
    game = newGame(); stage = "play"; paused = false;
    wake();
    game.humans[0] = $("duo").checked;
    $("veil").hidden = true;
    $("cove").scrollIntoView?.({ block: "nearest" });
  }
  function over() {
    const g = game, was = best;
    stage = "over";
    if (g.score > best) { best = g.score; try { localStorage.setItem(BEST, String(best)); } catch { /* as above */ } }
    $("veil-title").textContent = "Caught!";
    $("veil-text").textContent = `${cast[g.by].name} got you. ${points(g.score)} points, level ${g.level}.`;
    $("veil-best").textContent = g.score > was ? "Your best game so far." : `Your best: ${points(best)}`;
    $("veil-best").hidden = best === 0;
    $("play").textContent = "Play again";
    $("veil").hidden = false;
    $("play").focus({ preventScroll: true });
  }
  function frame(now) {
    const g = game;
    if (g && stage === "play" && !paused && !document.hidden) {
      step(g, Math.min(50, now - last));
      if (g.phase === "over") over();
    }
    paint(stage === "intro" ? null : g, now);
    hud();
    last = now;
    requestAnimationFrame(frame);
  }

  // The keys, and a swipe on a phone: the last direction asked for is taken at the next opening.
  const ARROWS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
  const WASD = { KeyW: 0, KeyD: 1, KeyS: 2, KeyA: 3 };               // by place on the keyboard, so a Greek layout works too
  const pause = () => { if (stage === "play") { paused = !paused; wake(); } };
  window.addEventListener("keydown", (e) => {
    if (stage !== "play" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === "Space" || e.code === "KeyP") { e.preventDefault(); if (!e.repeat) pause(); return; }
    const d = ARROWS[e.key] ?? WASD[e.code];
    if (d === undefined) return;
    e.preventDefault();
    if (game.humans[0] && e.code in WASD) game.wants[0] = d;         // two players: W A S D is Dimitris's
    else game.want = d;
  });
  let from = null;
  cove.addEventListener("pointerdown", (e) => { from = { x: e.clientX, y: e.clientY }; });
  cove.addEventListener("pointermove", (e) => {
    if (!from || stage !== "play") return;
    const dx = e.clientX - from.x, dy = e.clientY - from.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 14) return;
    game.want = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : dy > 0 ? 2 : 0;
    from = { x: e.clientX, y: e.clientY };
  });
  for (const type of ["pointerup", "pointercancel"]) cove.addEventListener(type, () => { from = null; });
  $("play").addEventListener("click", start);
  $("kymas").addEventListener("change", (e) => {
    const kymas = e.currentTarget.checked;
    look(kymas);
    try { localStorage.setItem(LOOK, kymas ? "1" : "0"); } catch { /* as above */ }
  });
  for (const type of ["pointerup", "keydown"]) window.addEventListener(type, wake);      // every touch may wake the sound again, should a phone have put it to sleep
  $("music").addEventListener("change", (e) => {
    music = e.currentTarget.checked; wake();
    try { localStorage.setItem(MUSIC, music ? "1" : "0"); } catch { /* as above */ }
    e.currentTarget.blur();
  });
  $("pause").addEventListener("click", (e) => { pause(); e.currentTarget.blur(); });     // so Space does not press it a second time

  // A new version of the page arriving mid-game hands the game over, paused, instead of ending it.
  const hot = window.claude?.hot;
  function boot(data) {
    const kept = data?.game;
    if (kept?.cells && kept.player && kept.chasers) { game = { ...kept, cells: Uint8Array.from(kept.cells) }; stage = "play"; paused = true; $("veil").hidden = true; }
    requestAnimationFrame((now) => { last = now; frame(now); });
  }
  try { hot?.snapshot?.(() => (game && stage === "play" ? { game: { ...game, cells: Array.from(game.cells) } } : {})); } catch { /* outside a viewer */ }
  // Who is chased (Dimitris, 25 Nov 2026: "i should be allowed to choose who is being chased"). `pictures`: every face
  // once loaded, or null while one is missing.
  const RUNNER = `${GAME.id}:runner`;
  let pictures = null;
  // Looks are kept in this browser, by who it is: "p0", "p1"… the people; "c0"…"c3" the four copies of a game's one chaser.
  const LOOKS = `${GAME.id}:looks`;
  let looks = {};
  try { looks = JSON.parse(localStorage.getItem(LOOKS)) || {}; } catch { /* a private window, or nothing kept yet */ }
  function lookOf(key) {
    const first = key[0] === "p" && GAME.chaser ? [null, "none"] : FIRST_LOOKS[Number(key.slice(1)) % FIRST_LOOKS.length];     // one who never chases has no colour
    const [colour, wear] = Array.isArray(looks[key]) ? looks[key] : first;
    return { colour: COLOURS[colour] ? colour : first[0], wear: WEARS[wear] ? wear : first[1] };
  }
  /** Dress everybody by the looks chosen, for whoever is chased now: the cast, the portraits, the Kymas, the small pictures. */
  function dress() {
    worn = WEARS[lookOf(`p${runner}`).wear].parts;
    const keys = GAME.chaser ? [0, 1, 2, 3].map((n) => `c${n}`) : GAME.people.map((_, n) => `p${n}`).filter((_, n) => n !== runner);
    cast = keys.map((key) => {
      const l = lookOf(key), n = Number(key.slice(1)), one = GAME.chaser || GAME.people[n];
      return { key, name: GAME.chaser ? WEARS[l.wear].as(one.name) : one.name, img: GAME.chaser ? pictures?.chaser : pictures?.people[n], palette: COLOURS[l.colour], parts: WEARS[l.wear].parts };
    });
    portraits = pictures && {
      runner: portraitOf(pictures.people[runner], worn),
      theirs: cast.map((c) => HEM.map((h) => portraitOf(c.img, c.parts, c.palette.m, h))),
      pale: cast.map((c) => HEM.map((h) => portraitOf(c.img, [], PALE.m, h, true))),      // a chaser that can be caught
    };
    front = sprite(ROSE, [FLOWER, ...worn]); theirs = cast.map((c) => sprite(c.palette, c.parts));
    names();
    look($("kymas").checked);
  }
  /** The wardrobe under the board: for everybody one thing to wear, and a colour for those who can be a chaser. */
  function wardrobe() {
    const list = $("looks-list"), keys = [...GAME.people.map((_, n) => `p${n}`), ...(GAME.chaser ? [0, 1, 2, 3].map((n) => `c${n}`) : [])];
    const held = [...list.querySelectorAll("button")].indexOf(document.activeElement);      // so that the button just pressed keeps the keyboard
    list.replaceChildren(...keys.map((key) => {
      const n = Number(key.slice(1)), l = lookOf(key), chases = key[0] === "c" || !GAME.chaser, parts = WEARS[l.wear].parts;
      const name = key[0] === "c" ? WEARS[l.wear].as(GAME.chaser.name) : GAME.people[n].name, img = key[0] === "c" ? pictures?.chaser : pictures?.people[n];
      const row = document.createElement("div"), pic = document.createElement("canvas"), body = document.createElement("div"), title = document.createElement("strong");
      row.className = "look"; title.textContent = name;
      if (faces && img) {                                            // as a chaser where they can be one, else as the one chased
        const made = portraitOf(img, parts, chases ? COLOURS[l.colour].m : null, chases ? 0 : null);
        pic.className = "tok"; pic.width = made.width; pic.height = made.height; pic.getContext("2d").drawImage(made, 0, 0);
      } else { pic.className = "pix"; paintKyma(pic, chases ? COLOURS[l.colour] : ROSE, chases ? parts : [FLOWER, ...parts]); }
      const picks = (label, options, chosen, set) => {
        const group = document.createElement("div");
        group.className = "picks"; group.setAttribute("role", "radiogroup"); group.setAttribute("aria-label", `${label}, ${name}`);
        for (const [value, text, colour] of options) {
          const b = document.createElement("button");
          b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", String(value === chosen));
          if (colour) { b.className = "swatch"; b.style.background = colour; b.title = text; b.setAttribute("aria-label", text); } else b.textContent = text;
          b.addEventListener("click", () => { set(value); try { localStorage.setItem(LOOKS, JSON.stringify(looks)); } catch { /* as above */ } dress(); });
          group.append(b);
        }
        return group;
      };
      body.append(title);
      if (chases) body.append(picks("Colour", Object.entries(COLOURS).map(([value, c]) => [value, value, c.m]), l.colour, (value) => { looks[key] = [value, l.wear]; }));
      body.append(picks("Wears", Object.entries(WEARS).map(([value, w]) => [value, w.name]), l.wear, (value) => { looks[key] = [l.colour, value]; }));
      row.append(pic, body);
      return row;
    }));
    if (held >= 0) list.querySelectorAll("button")[held]?.focus({ preventScroll: true });
  }
  /** Make people[i] the one who is chased; the others (or the game's one chaser, four times over) give chase. */
  function choose(i) {
    runner = i; person = GAME.people[i];
    game = null; stage = "intro"; $("veil").hidden = false;         // back to the start screen, with everybody at their places
    dress();
    intro();
    [...$("who-list").children].forEach((b, n) => b.setAttribute("aria-checked", String(n === i)));
  }
  /** The row of faces to choose from; hidden when there is only one. */
  function picker() {
    $("who").hidden = GAME.people.length < 2;
    GAME.people.forEach((one, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "radio");
      if (pictures) {
        const c = document.createElement("canvas"), img = pictures.people[i], side = Math.min(img.naturalWidth, img.naturalHeight);
        c.width = c.height = 80;
        c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 80, 80);
        b.append(c);
      }
      b.append(one.name);
      b.addEventListener("click", () => { choose(i); try { localStorage.setItem(RUNNER, String(i)); } catch { /* as above */ } });
      $("who-list").append(b);
    });
  }
  Promise.all([...GAME.people.map((one) => photo(one.photo)), photo(GAME.chaser?.photo)]).then((imgs) => {
    const chaser = imgs.pop();
    if (imgs.every(Boolean) && (chaser || !GAME.chaser)) pictures = { people: imgs, chaser };
    let kymas = false, first = 0;
    try { kymas = localStorage.getItem(LOOK) === "1"; first = Number(localStorage.getItem(RUNNER)) || 0; } catch { /* a private window: the faces, and the first of the people */ }
    if (!GAME.kymas) kymas = false;                                  // a game that leaves the Kymas out
    $("look").hidden = !pictures || !GAME.kymas;                     // without pictures there is nothing to choose
    $("kymas").checked = kymas;
    picker();
    choose(GAME.people[first] ? first : 0);
    if (hot?.ready) hot.ready(boot); else boot(hot?.data);
  });
})();
